name: Refresh screener data
# Analyses the stalest tickers in data/universe.csv each weekday and commits data/results.csv.
# Needs a repository secret named FMP_API_KEY (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the US close
  workflow_dispatch:
    inputs:
      max:
        description: "Max tickers to refresh"
        default: "25"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -m src.cli refresh --max ${{ github.event.inputs.max || '25' }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.csv
          git diff --cached --quiet || git commit -m "data: refresh screener results" && git push
